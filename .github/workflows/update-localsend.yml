name: Update LocalSend

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-localsend
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest stable release
        id: release
        shell: pwsh
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/localsend/localsend/releases/latest" `
            -Headers $headers

          $version = $release.tag_name -replace '^v', ''

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Unexpected release version: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT

          Write-Host "Latest LocalSend version: $version"

      - name: Download and update LocalSend architectures
        id: download
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $temp = Join-Path $env:RUNNER_TEMP "localsend-update"

          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          $architectures = @{
            x64   = "LocalSend64"
            arm64 = "LocalSendarm64"
          }

          foreach ($arch in @("x64", "arm64")) {
            if ($arch -eq "x64") {
              $assetArch = "x86-64"
            }
            else {
              $assetArch = "arm-64"
            }

            $filename = "LocalSend-$version-windows-$assetArch.zip"

            $url = "https://github.com/localsend/localsend/releases/latest/download/$filename"

            $zip = Join-Path $temp $filename
            $extract = Join-Path $temp $arch

            Write-Host "Downloading: $url"

            Invoke-WebRequest `
              -Uri $url `
              -OutFile $zip `
              -MaximumRedirection 10

            if (-not (Test-Path -LiteralPath $zip) -or
                (Get-Item -LiteralPath $zip).Length -eq 0) {
              throw "Download failed or ZIP is empty: $filename"
            }

            # Validate ZIP integrity.
            Add-Type -AssemblyName System.IO.Compression.FileSystem

            $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)

            try {
              if ($archive.Entries.Count -eq 0) {
                throw "ZIP archive is empty: $filename"
              }
            }
            finally {
              $archive.Dispose()
            }

            # Extract the downloaded archive.
            if (Test-Path -LiteralPath $extract) {
              Remove-Item -LiteralPath $extract -Recurse -Force
            }

            New-Item -ItemType Directory -Force -Path $extract | Out-Null

            Expand-Archive `
              -LiteralPath $zip `
              -DestinationPath $extract `
              -Force

            # Locate the actual LocalSend application directory.
            $exe = Get-ChildItem `
              -LiteralPath $extract `
              -Filter "localsend_app.exe" `
              -File `
              -Recurse |
              Select-Object -First 1

            if (-not $exe) {
              throw "localsend_app.exe not found in $filename"
            }

            $source = $exe.Directory.FullName
            $target = Join-Path "App" $architectures[$arch]

            if (-not (Test-Path -LiteralPath $target)) {
              New-Item `
                -ItemType Directory `
                -Force `
                -Path $target | Out-Null
            }

            Write-Host "Updating $target"

            # Remove old application files.

            # Copy the new application files.
            Get-ChildItem -LiteralPath $source -Force |
              Copy-Item -Destination $target -Recurse -Force

            # Validate the updated application.
            $updatedExe = Join-Path $target "localsend_app.exe"

            if (-not (Test-Path -LiteralPath $updatedExe)) {
              throw "LocalSend executable missing after update: $target"
            }

            Write-Host "Successfully updated $target"
          }

      - name: Update appinfo.ini version
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"

          # LocalSend uses a three-part version, e.g. 1.18.2.
          $displayVersion = $version

          # Find appinfo.ini automatically.
          $files = Get-ChildItem `
            -Path . `
            -Filter "appinfo.ini" `
            -File `
            -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/]\.git[\\/]'
            }

          if (-not $files) {
            throw "appinfo.ini was not found anywhere in the repository."
          }

          $file = $files | Select-Object -First 1
          $path = $file.FullName

          Write-Host "Updating: $path"

          $lines = Get-Content -LiteralPath $path

          $inVersion = $false
          $foundPackage = $false
          $foundDisplay = $false

          for ($i = 0; $i -lt $lines.Count; $i++) {
            $line = $lines[$i].Trim()

            if ($line -match '^\[Version\]$') {
              $inVersion = $true
              continue
            }

            if ($line -match '^\[.+\]$') {
              $inVersion = $false
            }

            if ($inVersion -and $line -match '^PackageVersion\s*=') {
              $lines[$i] = "PackageVersion=$version"
              $foundPackage = $true
            }

            if ($inVersion -and $line -match '^DisplayVersion\s*=') {
              $lines[$i] = "DisplayVersion=$displayVersion"
              $foundDisplay = $true
            }
          }

          if (-not $foundPackage -or -not $foundDisplay) {
            throw "PackageVersion or DisplayVersion was not found in the [Version] section of $path"
          }

          # Replace only the existing version entries.
          Set-Content -LiteralPath $path -Value $lines -Encoding UTF8

          Write-Host "Updated PackageVersion=$version"
          Write-Host "Updated DisplayVersion=$displayVersion"

      - name: Commit and push changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git status --short

          if (git diff --cached --quiet) {
            Write-Host "No changes detected. Nothing to commit."
            exit 0
          }

          git commit -m "Update LocalSend to ${{ steps.release.outputs.version }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Git commit failed."
          }

          git push origin "HEAD:${{ github.ref_name }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Git push failed."
          }

          Write-Host "LocalSend updated, committed and pushed successfully."
