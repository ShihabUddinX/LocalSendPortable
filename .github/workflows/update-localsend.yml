name: Update LocalSend

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-localsend
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest stable release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
              Authorization = "Bearer $env:GH_TOKEN"
          }

          $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/localsend/localsend/releases/latest" `
              -Headers $headers

          $version = $release.tag_name -replace '^v', ''

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Unexpected release version: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT

          Write-Host "Latest stable version: $version"

      - name: Download and extract architecture ZIPs
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $architectures = @{
              "x86-64" = "LocalSend64"
              "arm-64" = "LocalSendarm64"
          }

          $root = $env:GITHUB_WORKSPACE
          $temp = $env:RUNNER_TEMP

          foreach ($arc in @("x86-64", "arm-64")) {
              $folder = $architectures[$arc]

              $zip = Join-Path $temp "LocalSend-$arc.zip"
              $extract = Join-Path $temp "LocalSend-$arc"
              $target = Join-Path $root "App\$folder"

              $url = "https://github.com/localsend/localsend/releases/latest/download/LocalSend-$($env:VERSION)-windows-$arc.zip"

              Write-Host "Downloading $url"

              Invoke-WebRequest `
                  -Uri $url `
                  -OutFile $zip

              if (Test-Path $extract) {
                  Remove-Item $extract -Recurse -Force
              }

              New-Item -ItemType Directory -Path $extract -Force |
                  Out-Null

              Expand-Archive `
                  -LiteralPath $zip `
                  -DestinationPath $extract `
                  -Force

              # Validate the extracted archive.
              $exe = Get-ChildItem `
                  -LiteralPath $extract `
                  -Filter "*.exe" `
                  -File `
                  -Recurse |
                  Select-Object -First 1

              if (-not $exe) {
                  throw "No EXE found in the $arc archive."
              }

              # Preserve portable metadata and settings.
              $preserve = @()

              if (Test-Path $target) {
                  foreach ($name in @(".portable", "settings")) {
                      $old = Join-Path $target $name

                      if (Test-Path $old) {
                          $backup = Join-Path $temp "$folder-preserve-$name"

                          if (Test-Path $backup) {
                              Remove-Item $backup -Recurse -Force
                          }

                          Copy-Item `
                              -LiteralPath $old `
                              -Destination $backup `
                              -Recurse `
                              -Force

                          $preserve += @{
                              Name = $name
                              Backup = $backup
                          }
                      }
                  }

                  Remove-Item $target -Recurse -Force
              }

              New-Item -ItemType Directory -Path $target -Force |
                  Out-Null

              # Copy all extracted files, preserving archive structure.
              Get-ChildItem -LiteralPath $extract -Force |
                  Copy-Item -Destination $target -Recurse -Force

              foreach ($item in $preserve) {
                  $destination = Join-Path $target $item.Name

                  if (Test-Path $destination) {
                      Remove-Item $destination -Recurse -Force
                  }

                  Copy-Item `
                      -LiteralPath $item.Backup `
                      -Destination $destination `
                      -Recurse `
                      -Force
              }

              Write-Host "Updated $target"
          }

      - name: Update appinfo.ini version
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $files = Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter "appinfo.ini" `
              -File `
              -Recurse

          if (-not $files) {
              throw "appinfo.ini not found."
          }

          foreach ($file in $files) {
              $content = Get-Content -LiteralPath $file.FullName -Raw

              if ($content -match '(?m)^\[Version\]\s*$') {
                  $sectionPattern = '(?ms)(^\[Version\]\s*\r?\n)(.*?)(?=^\[|\z)'

                  $content = [regex]::Replace(
                      $content,
                      $sectionPattern,
                      {
                          param($match)

                          $section = $match.Groups[2].Value

                          if ($section -match '(?m)^PackageVersion=') {
                              $section = [regex]::Replace(
                                  $section,
                                  '(?m)^PackageVersion=.*$',
                                  "PackageVersion=$env:VERSION"
                              )
                          } else {
                              $section += "`r`nPackageVersion=$env:VERSION"
                          }

                          if ($section -match '(?m)^DisplayVersion=') {
                              $section = [regex]::Replace(
                                  $section,
                                  '(?m)^DisplayVersion=.*$',
                                  "DisplayVersion=$env:VERSION"
                              )
                          } else {
                              $section += "`r`nDisplayVersion=$env:VERSION"
                          }

                          return $match.Groups[1].Value + $section
                      }
                  )

                  Set-Content `
                      -LiteralPath $file.FullName `
                      -Value $content `
                      -Encoding UTF8

                  Write-Host "Updated version in $($file.FullName)"
              }
          }

      - name: Commit and push changes
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
              Write-Host "No changes to commit."
              exit 0
          }

          git commit -m "Update LocalSend to $env:VERSION"
          if ($LASTEXITCODE -ne 0) {
              throw "Git commit failed."
          }

          git push
          if ($LASTEXITCODE -ne 0) {
              throw "Git push failed."
          }
