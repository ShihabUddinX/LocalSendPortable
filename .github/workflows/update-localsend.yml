name: Update LocalSend

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-localsend
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest stable release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GH_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/localsend/localsend/releases/latest" `
              -Headers $headers

          $version = $release.tag_name -replace '^v', ''

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Unexpected release version: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT

          Write-Host "Latest stable version: $version"

      - name: Download and extract architecture ZIPs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GH_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/localsend/localsend/releases/tags/$env:TAG" `
              -Headers $headers

          $architectures = @(
              @{
                  Suffix = "windows-x86-64.zip"
                  Folder = "LocalSend64"
              },
              @{
                  Suffix = "windows-arm-64.zip"
                  Folder = "LocalSendarm64"
              }
          )

          foreach ($arch in $architectures) {
              $asset = $release.assets |
                  Where-Object {
                      $_.name -eq "LocalSend-$env:VERSION-$($arch.Suffix)"
                  } |
                  Select-Object -First 1

              if (-not $asset) {
                  throw "Release asset not found: LocalSend-$env:VERSION-$($arch.Suffix)"
              }

              $zip = Join-Path $env:RUNNER_TEMP $asset.name
              $extract = Join-Path $env:RUNNER_TEMP $arch.Folder
              $target = Join-Path $env:GITHUB_WORKSPACE "App\$($arch.Folder)"

              Write-Host "Downloading $($asset.name)"

              Invoke-WebRequest `
                  -Uri $asset.browser_download_url `
                  -OutFile $zip

              if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
                  throw "Download failed: $($asset.name)"
              }

              if (Test-Path $extract) {
                  Remove-Item $extract -Recurse -Force
              }

              New-Item -ItemType Directory -Path $extract -Force |
                  Out-Null

              Expand-Archive `
                  -LiteralPath $zip `
                  -DestinationPath $extract `
                  -Force

              $exe = Get-ChildItem `
                  -LiteralPath $extract `
                  -Filter "*.exe" `
                  -File `
                  -Recurse |
                  Select-Object -First 1

              if (-not $exe) {
                  throw "No EXE found in $($asset.name)"
              }

              if (Test-Path $target) {
                  Remove-Item $target -Recurse -Force
              }

              New-Item -ItemType Directory -Path $target -Force |
                  Out-Null

              Get-ChildItem -LiteralPath $extract -Force |
                  Copy-Item -Destination $target -Recurse -Force

              if (-not (Get-ChildItem -LiteralPath $target -Filter "*.exe" -File -Recurse)) {
                  throw "Extracted EXE missing from $target"
              }

              Write-Host "Successfully updated $($arch.Folder)"
          }

      - name: Update appinfo.ini version
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $files = Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Filter "appinfo.ini" `
              -File `
              -Recurse

          if (-not $files) {
              throw "appinfo.ini not found."
          }

          foreach ($file in $files) {
              $content = Get-Content -LiteralPath $file.FullName -Raw

              if ($content -match '(?m)^\[Version\]\s*$') {
                  $pattern = '(?ms)(^\[Version\]\s*\r?\n)(.*?)(?=^\[|\z)'

                  $content = [regex]::Replace(
                      $content,
                      $pattern,
                      {
                          param($match)

                          $section = $match.Groups[2].Value

                          foreach ($key in @("PackageVersion", "DisplayVersion")) {
                              if ($section -match "(?m)^$key=") {
                                  $section = [regex]::Replace(
                                      $section,
                                      "(?m)^$key=.*$",
                                      "$key=$env:VERSION"
                                  )
                              } else {
                                  $section += "`r`n$key=$env:VERSION"
                              }
                          }

                          return $match.Groups[1].Value + $section
                      }
                  )

                  Set-Content `
                      -LiteralPath $file.FullName `
                      -Value $content `
                      -Encoding UTF8

                  Write-Host "Updated $($file.FullName)"
              }
          }

      - name: Commit and push changes
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
              Write-Host "No changes to commit."
              exit 0
          }

          git commit -m "Update LocalSend to $env:VERSION"
          if ($LASTEXITCODE -ne 0) {
              throw "Git commit failed."
          }

          git push
          if ($LASTEXITCODE -ne 0) {
              throw "Git push failed."
          }
